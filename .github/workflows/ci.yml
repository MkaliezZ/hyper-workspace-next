name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: hyper
          POSTGRES_PASSWORD: hyper-ci-only
          POSTGRES_DB: hyper_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hyper -d hyper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://hyper:hyper-ci-only@127.0.0.1:5432/hyper_test
      TEST_DATABASE_URL: postgres://hyper:hyper-ci-only@127.0.0.1:5432/hyper_test
      DEMO_MODE: "true"
      APP_ORIGIN: http://127.0.0.1:5173
      API_PORT: "3100"
      CREDENTIAL_MASTER_KEY: "abababababababababababababababababababababababababababababababab"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.14.1"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.6"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, public source archive only
        with:
          path: .runtime/hermes-source.tar.gz
          key: hermes-source-${{ hashFiles('runtime/hermes/lock.json') }}
      - run: npm ci
      - run: node scripts/dependency-inventory.mjs --check
      - run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - name: Verify the intranet IP TLS proxy in an isolated loopback environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx
          nginx -v
          node scripts/ci/intranet-proxy.mjs
      - run: npm audit --prefix runtime/evaluations --audit-level=high --registry=https://registry.npmjs.org
      - run: python3 docs/handoff-v1/verify_package.py
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest discover -s runtime/hermes -p 'test_*.py'
      - run: python3 -m unittest discover -s runtime/nextcloud -p 'test_*.py'
      - run: python3 tests/office/test_protocol.py -v
      - run: node --test runtime/office-gateway/gateway.test.mjs scripts/ci/office-installation.test.mjs
      - run: python3 -m venv .runtime/documents
      - run: .runtime/documents/bin/python -m pip install --require-hashes -r runtime/documents/requirements.lock --index-url https://pypi.org/simple
      - run: .runtime/documents/bin/python -m unittest discover -s runtime/documents -p test_extract.py -v
      - run: npm run test:integration
        env:
          BACKUP_TEST_CONTAINER: ${{ job.services.postgres.id }}
      - run: npm ci --prefix runtime/dsh
      - run: npm audit --prefix runtime/dsh --audit-level=high --registry=https://registry.npmjs.org
      - run: python3 runtime/hermes/download.py
      - run: python3 runtime/hermes/install.py
      - run: npm run test:runtime
      - run: npm run build
      - run: npm run migrate && npm run seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  nextcloud-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: hyper
          POSTGRES_PASSWORD: hyper-ci-only
          POSTGRES_DB: hyper_identity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hyper -d hyper_identity_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://hyper:hyper-ci-only@127.0.0.1:5432/hyper_identity_test
      TEST_DATABASE_URL: postgres://hyper:hyper-ci-only@127.0.0.1:5432/hyper_identity_test
      DEMO_MODE: "false"
      APP_ORIGIN: http://127.0.0.1:5173
      API_PORT: "3100"
      CREDENTIAL_MASTER_KEY: "abababababababababababababababababababababababababababababababab"
      NEXTCLOUD_URL: http://127.0.0.1:8090
      NEXTCLOUD_WORKSPACE_ID: 10000000-0000-4000-8000-000000000001
      NEXTCLOUD_MEMBER_GROUP: hyper-members
      NEXTCLOUD_BOOTSTRAP_ADMIN_IDS: '["employee-one"]'
      WORKSPACE_NAME: Synthetic Nextcloud CI Workspace
      NC_TEST_PASSWORD: Hyper-CI-Fixture-Only-1234!
      NEXTCLOUD_TALK_ENABLED: "true"
      NEXTCLOUD_FILES_ENABLED: "true"
      NEXTCLOUD_CALENDAR_ENABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.14.1"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.6"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, public source archive only
        with:
          path: .runtime/hermes-source.tar.gz
          key: hermes-source-${{ hashFiles('runtime/hermes/lock.json') }}
      - run: npm ci
      - run: npm ci --prefix runtime/dsh
      - run: python3 runtime/hermes/download.py
      - run: python3 runtime/hermes/install.py
      - run: bash scripts/ci/nextcloud-setup.sh
      - run: python3 -m venv .runtime/documents && .runtime/documents/bin/python -m pip install --require-hashes -r runtime/documents/requirements.lock --index-url https://pypi.org/simple
      - run: npm run migrate && npm run workspace:init
      - run: npx playwright install --with-deps chromium
      - name: Verify real CalDAV and local scheduling
        run: npm run test:nextcloud -- calendar-meeting.spec.ts calendar.spec.ts
      - name: Verify other real Nextcloud workflows
        run: npm run test:nextcloud -- files.spec.ts login.spec.ts notifications.spec.ts search.spec.ts talk.spec.ts
      - if: failure()
        run: |
          if docker inspect hyper-nextcloud-test >/dev/null 2>&1; then
            docker inspect --format '{{.State.Status}} OOM={{.State.OOMKilled}}' hyper-nextcloud-test
            docker logs --tail 80 hyper-nextcloud-test 2>&1 | python3 -c 'import sys,re; print("\n".join(line.strip() for line in sys.stdin if re.fullmatch(r"hyper_source status=\d{3} duration_us=\d+\n?",line)))'
          fi

  office:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: hyper
          POSTGRES_PASSWORD: hyper-ci-only
          POSTGRES_DB: hyper_office_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hyper -d hyper_office_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://hyper:hyper-ci-only@127.0.0.1:5432/hyper_office_test
      TEST_DATABASE_URL: postgres://hyper:hyper-ci-only@127.0.0.1:5432/hyper_office_test
      DEMO_MODE: "false"
      APP_ORIGIN: http://127.0.0.1:5173
      API_PORT: "3100"
      CREDENTIAL_MASTER_KEY: "abababababababababababababababababababababababababababababababab"
      NEXTCLOUD_URL: http://127.0.0.1:8090
      NEXTCLOUD_WORKSPACE_ID: 10000000-0000-4000-8000-000000000001
      NEXTCLOUD_MEMBER_GROUP: hyper-members
      NEXTCLOUD_BOOTSTRAP_ADMIN_IDS: '["employee-one"]'
      WORKSPACE_NAME: Synthetic Office CI Workspace
      NC_TEST_PASSWORD: Hyper-CI-Fixture-Only-1234!
      NEXTCLOUD_TALK_ENABLED: "false"
      NEXTCLOUD_FILES_ENABLED: "true"
      NEXTCLOUD_CALENDAR_ENABLED: "false"
      NEXTCLOUD_OFFICE_ENABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.14.1"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.6"
      - run: npm ci
      - run: bash scripts/ci/nextcloud-setup.sh
      - run: python3 -m venv .runtime/documents && .runtime/documents/bin/python -m pip install --require-hashes -r runtime/documents/requirements.lock --index-url https://pypi.org/simple
      - run: npm run migrate && npm run workspace:init
      - run: npx playwright install --with-deps chromium
      - name: Verify the real Nextcloud Office editor
        run: |
          bash scripts/ci/office-setup.sh
          npm run test:nextcloud -- office.spec.ts office-collaboration.spec.ts
      - name: Verify the same Office core for editable copies
        run: bash scripts/ci/office-batch.sh
      - name: Verify reviewed copies against real Nextcloud and the editor
        run: bash scripts/ci/office-tools-source.sh
      - if: failure()
        run: |
          if docker inspect hyper-collabora-test >/dev/null 2>&1; then
            docker inspect --format '{{.State.Status}} OOM={{.State.OOMKilled}} exit={{.State.ExitCode}}' hyper-collabora-test
            docker logs --tail 300 hyper-collabora-test 2>&1 | python3 scripts/ci/office-diagnostics.py
          fi
          if docker inspect hyper-nextcloud-test >/dev/null 2>&1; then
            docker inspect --format '{{.State.Status}} OOM={{.State.OOMKilled}}' hyper-nextcloud-test
            docker logs --tail 80 hyper-nextcloud-test 2>&1 | python3 -c 'import sys,re; print("\n".join(line.strip() for line in sys.stdin if re.fullmatch(r"hyper_source status=\d{3} duration_us=\d+\n?",line)))'
          fi

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      COMPOSE_TEST_PROJECT: hyper-deployment-ci
      COMPOSE_TEST_ENV: .runtime/compose-ci.env
      HYPER_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.14.1"
          cache: npm
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, public source archive only
        with:
          path: .runtime/hermes-source.tar.gz
          key: hermes-source-${{ hashFiles('runtime/hermes/lock.json') }}
      - run: npm ci
      - run: python3 runtime/hermes/download.py
      - run: |
          python3 runtime/hermes/bootstrap_cache.py --prepare-build
          node scripts/deploy-init.mjs .runtime/compose-ci.env
          docker compose version
          docker compose --project-name hyper-deployment-ci --env-file .runtime/compose-ci.env -f compose.yaml -f deploy/compose.ci.yaml config --quiet
      - run: docker compose --project-name hyper-deployment-ci --env-file .runtime/compose-ci.env -f compose.yaml -f deploy/compose.ci.yaml build api
      - run: docker compose --project-name hyper-deployment-ci --env-file .runtime/compose-ci.env -f compose.yaml -f deploy/compose.ci.yaml up -d --no-build --wait --wait-timeout 180
      - run: npx playwright install --with-deps chromium
      - run: npm run test:deployment
      - name: Verify the private CPU OCR service
        run: |
          ocr_compose() {
            docker compose --project-name hyper-deployment-ci --env-file .runtime/compose-ci.env -f compose.yaml -f deploy/compose.ci.yaml -f deploy/compose.local-ocr.yaml "$@"
          }
          ocr_compose config --quiet
          ocr_compose build ocr
          ocr_compose up -d --no-build --wait --wait-timeout 180
          ocr_compose exec -T api node --import tsx --input-type=module -e '
            import assert from "node:assert/strict";
            import { OcrProvider } from "./dist/core/ocr-provider.js";
            const parts = [];
            for await (const part of process.stdin) parts.push(part);
            const result = await new OcrProvider().recognize({
              bytes: Buffer.concat(parts), mime: "image/png", page: 1,
            });
            assert.equal(result.engine, "rapidocr-cpu/v1");
            const table = result.content.blocks.find((block) => block.kind === "table");
            assert.equal(table?.text, "品名 Item\t数量 Qty\t金额 Amount\n白板笔\t3\t42.50\n便签纸\t7\t19.60\n合计 Total\t10\t62.10");
            assert.ok(result.content.blocks.some((block) => block.text === "合成采购记录"));
          ' < tests/fixtures/ocr-procurement.png
      - name: Verify the private Office service from the application container
        run: |
          office_compose() {
            docker compose --project-name hyper-deployment-ci --env-file .runtime/compose-ci.env -f compose.yaml -f deploy/compose.ci.yaml -f deploy/compose.local-ocr.yaml -f deploy/compose.office-tools.yaml "$@"
          }
          office_compose config --quiet
          office_compose build office-batch
          office_compose up -d --no-build --wait --wait-timeout 180
          office_compose exec -T api /app/.runtime/documents/bin/python - create docx < tests/fixtures/office-roundtrip.py > .runtime/office-compose-seed.docx
          office_compose exec -T api node --import tsx --input-type=module -e '
            import assert from "node:assert/strict";
            import { OfficeProvider } from "./dist/core/office-provider.js";
            const parts = [];
            for await (const part of process.stdin) parts.push(part);
            const bytes = Buffer.concat(parts), provider = new OfficeProvider();
            const observed = await provider.inspect({bytes,format:"docx"});
            assert.ok(observed.inspection.paragraphs.length);
            const result = await provider.transform({bytes,format:"docx",operations:[{kind:"writer.append",target:"document:end",text:"Private deployment copy verified"}]});
            assert.equal(result.preview.reopenedVerified,true);
            assert.equal(result.preview.operations[0].after,"Private deployment copy verified");
            assert.notDeepEqual(result.bytes,bytes);
          ' < .runtime/office-compose-seed.docx
      - name: Verify the documented Office installation with the source and gateway
        timeout-minutes: 15
        run: bash scripts/ci/office-installation.sh
      - if: failure()
        run: docker compose --project-name hyper-deployment-ci --env-file .runtime/compose-ci.env -f compose.yaml -f deploy/compose.ci.yaml -f deploy/compose.local-ocr.yaml logs --tail 100
      - if: always()
        run: docker compose --project-name hyper-deployment-ci --env-file .runtime/compose-ci.env -f compose.yaml -f deploy/compose.ci.yaml -f deploy/compose.local-ocr.yaml -f deploy/compose.office-tools.yaml down --volumes
